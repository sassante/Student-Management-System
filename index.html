<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --ink:#14262B; --muted:#586A6F; --line:#D3DBDA;
  --accent:#1F6F6B; --accent-ink:#FFFFFF; --accent-soft:#DCEDEA; --danger:#B3382C; --danger-soft:#F7E1DE;
  --ok:#1F6F3A;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E181B; --surface:#162428; --ink:#E6EEEC; --muted:#93A6A9; --line:#2A3C41;
    --accent:#5CC2B8; --accent-ink:#0E181B; --accent-soft:#1D3A3B; --danger:#F27F70; --danger-soft:#3A2220;
    --ok:#6FD08F;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181B; --surface:#162428; --ink:#E6EEEC; --muted:#93A6A9; --line:#2A3C41;
  --accent:#5CC2B8; --accent-ink:#0E181B; --accent-soft:#1D3A3B; --danger:#F27F70; --danger-soft:#3A2220;
  --ok:#6FD08F;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 64px}

/* header */
header.top{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;letter-spacing:-.03em;margin:0}
.summary{display:flex;gap:28px;margin:12px 0 0;color:var(--muted);font-size:.95rem}
.summary b{font-family:var(--display);font-size:1.5rem;color:var(--ink);font-weight:800;margin-right:6px;letter-spacing:-.02em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{padding:4px 10px;min-height:34px;font-size:.9rem;border-width:1px;border-color:var(--line)}
.btn.small.del{color:var(--danger)}
.btn.small.del:hover{background:var(--danger-soft)}

/* toolbar */
.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin-bottom:14px}
.toolbar input,.toolbar select,.field input,.field select{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;min-height:44px}
.toolbar input:focus,.field input:focus,.field select:focus{border-color:var(--accent)}
@media (max-width:640px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}

/* table */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.85rem;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.who{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.who:hover .nm{text-decoration:underline}
.chip{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:.95rem}
.nm{font-weight:600;display:block}
.em{color:var(--muted);font-size:.88rem;display:block}
.sid{font-variant-numeric:tabular-nums;color:var(--muted)}
.gpa{font-family:var(--display);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:1.25rem;margin-bottom:4px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(480px,calc(100% - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(8,16,18,.55)}
.dlg{padding:24px}
.dlg h2{font-family:var(--display);font-size:1.6rem;letter-spacing:-.02em;margin:0 0 16px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;margin-bottom:4px;font-size:.95rem}
.field .err{color:var(--danger);font-size:.88rem;margin-top:4px;min-height:0}
.field input[aria-invalid="true"],.field select[aria-invalid="true"]{border-color:var(--danger)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
dl.detail{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;margin:0}
dl.detail dt{color:var(--muted)}
dl.detail dd{margin:0;font-weight:500}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.hero .chip{width:56px;height:56px;font-size:1.3rem;border-radius:14px}
.hero h2{margin:0}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Student records</h1>
      <p class="summary" id="summary" aria-live="polite"></p>
    </div>
    <button class="btn primary" id="addBtn" type="button">Add student</button>
  </header>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Search by name, ID, or email" aria-label="Search students">
    <select id="courseFilter" aria-label="Filter by course"></select>
    <select id="sortBy" aria-label="Sort students">
      <option value="name">Sort by name</option>
      <option value="id">Sort by ID</option>
      <option value="gpa">Sort by GPA (high to low)</option>
      <option value="year">Sort by year</option>
    </select>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>Student</th><th>ID</th><th>Course</th><th>Year</th><th>GPA</th><th><span class="sr" style="position:absolute;left:-9999px">Actions</span></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden></div>
  </div>
</div>

<!-- add / edit -->
<dialog id="formDlg" aria-labelledby="formTitle">
  <form class="dlg" id="form" novalidate>
    <h2 id="formTitle">Add student</h2>
    <div class="field"><label for="f-name">Full name</label><input id="f-name" name="name" autocomplete="off"><div class="err" data-for="name"></div></div>
    <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="off"><div class="err" data-for="email"></div></div>
    <div class="field"><label for="f-course">Course</label><select id="f-course" name="course"></select><div class="err" data-for="course"></div></div>
    <div class="row2">
      <div class="field"><label for="f-year">Year</label>
        <select id="f-year" name="year"><option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option><option value="4">Year 4</option></select>
        <div class="err" data-for="year"></div></div>
      <div class="field"><label for="f-gpa">GPA (0.0 – 4.0)</label><input id="f-gpa" name="gpa" type="number" step="0.01" min="0" max="4" inputmode="decimal"><div class="err" data-for="gpa"></div></div>
    </div>
    <div class="dlg-actions">
      <button class="btn" type="button" id="cancelForm">Cancel</button>
      <button class="btn primary" type="submit" id="saveBtn">Save student</button>
    </div>
  </form>
</dialog>

<!-- details -->
<dialog id="viewDlg" aria-labelledby="viewName">
  <div class="dlg">
    <div class="hero"><div class="chip" id="v-chip"></div><h2 id="viewName"></h2></div>
    <dl class="detail" id="v-detail"></dl>
    <div class="dlg-actions">
      <button class="btn" type="button" id="v-close">Close</button>
      <button class="btn" type="button" id="v-edit">Edit student</button>
      <button class="btn danger" type="button" id="v-del">Delete student</button>
    </div>
  </div>
</dialog>

<!-- confirm delete -->
<dialog id="delDlg" aria-labelledby="delTitle">
  <div class="dlg">
    <h2 id="delTitle">Delete this student?</h2>
    <p id="delMsg" style="margin:0;color:var(--muted)"></p>
    <div class="dlg-actions">
      <button class="btn" type="button" id="delCancel">Keep student</button>
      <button class="btn danger" type="button" id="delOk">Delete student</button>
    </div>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Data layer (pure functions, easy to test) ---------- */
const COURSES = ["Computer Science","Business Administration","Mechanical Engineering","Nursing","Psychology","Graphic Design"];
const STORE_KEY = "sms.students.v1";

const SEED = [
  {name:"Ama Mensah",email:"ama.mensah@campus.edu",course:"Computer Science",year:3,gpa:3.82},
  {name:"Kwame Boateng",email:"kwame.boateng@campus.edu",course:"Mechanical Engineering",year:2,gpa:3.41},
  {name:"Efua Owusu",email:"efua.owusu@campus.edu",course:"Nursing",year:4,gpa:3.67},
  {name:"Daniel Asante",email:"daniel.asante@campus.edu",course:"Business Administration",year:1,gpa:2.95},
  {name:"Naa Lamptey",email:"naa.lamptey@campus.edu",course:"Graphic Design",year:2,gpa:3.58},
  {name:"Yaw Darko",email:"yaw.darko@campus.edu",course:"Psychology",year:3,gpa:3.12}
];

function nextId(list){
  const max = list.reduce((m,s)=>Math.max(m, parseInt(String(s.id).replace(/\D/g,""),10)||0), 0);
  return "S" + String(max+1).padStart(4,"0");
}
function normalize(d){
  return {name:String(d.name).trim(), email:String(d.email).trim(), course:d.course, year:Number(d.year), gpa:Math.round(Number(d.gpa)*100)/100};
}
function validate(d, list, editingId){
  const e = {};
  if(!String(d.name||"").trim()) e.name = "Enter the student's full name.";
  const email = String(d.email||"").trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email = "Enter a valid email, like name@school.edu.";
  else if(list.some(s=>s.id!==editingId && s.email.toLowerCase()===email.toLowerCase())) e.email = "Another student already uses this email.";
  if(!COURSES.includes(d.course)) e.course = "Choose a course.";
  if(![1,2,3,4].includes(Number(d.year))) e.year = "Choose a year.";
  const g = Number(d.gpa);
  if(d.gpa===""||d.gpa===null||d.gpa===undefined||isNaN(g)||g<0||g>4) e.gpa = "Enter a GPA from 0.0 to 4.0.";
  return e;
}
function createStudent(list, d){ return [...list, {id:nextId(list), ...normalize(d)}]; }
function updateStudent(list, id, d){ return list.map(s=>s.id===id ? {id, ...normalize(d)} : s); }
function deleteStudent(list, id){ return list.filter(s=>s.id!==id); }
function queryStudents(list, {q="", course="all", sort="name"}){
  const needle = q.trim().toLowerCase();
  let out = list.filter(s=>
    (course==="all"||s.course===course) &&
    (!needle || [s.name,s.id,s.email].some(v=>v.toLowerCase().includes(needle))));
  const cmp = {
    name:(a,b)=>a.name.localeCompare(b.name),
    id:(a,b)=>a.id.localeCompare(b.id),
    gpa:(a,b)=>b.gpa-a.gpa || a.name.localeCompare(b.name),
    year:(a,b)=>a.year-b.year || a.name.localeCompare(b.name)
  }[sort];
  return out.sort(cmp);
}

/* ---------- Storage ---------- */
function seeded(){ return SEED.reduce((l,d)=>createStudent(l,d),[]); }
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const arr = JSON.parse(raw); if(Array.isArray(arr)) return arr; }
  }catch(err){}
  return seeded();
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(students)); }catch(err){} }

let students = load();
const view = {q:"", course:"all", sort:"name"};
let editingId = null, pendingDeleteId = null, viewingId = null;

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const initials = n => n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const hue = c => (COURSES.indexOf(c)*57 + 170) % 360;
function chipStyle(el, course){ el.style.background = `hsl(${hue(course)} 45% 36%)`; }
let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
function el(tag, props={}, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==="class") n.className = v; else if(k==="text") n.textContent = v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k,v);
  }
  kids.forEach(c=>n.append(c)); return n;
}

/* ---------- Render ---------- */
function render(){
  const list = queryStudents(students, view);
  const tbody = $("rows"); tbody.replaceChildren();
  list.forEach(s=>{
    const chip = el("span",{class:"chip",text:initials(s.name),"aria-hidden":"true"}); chipStyle(chip,s.course);
    const who = el("button",{class:"who",type:"button",onclick:()=>openView(s.id)},
      chip, el("span",{}, el("span",{class:"nm",text:s.name}), el("span",{class:"em",text:s.email})));
    const actions = el("div",{class:"actions"},
      el("button",{class:"btn small",type:"button","aria-label":"Edit "+s.name,text:"Edit",onclick:()=>openForm(s.id)}),
      el("button",{class:"btn small del",type:"button","aria-label":"Delete "+s.name,text:"Delete",onclick:()=>askDelete(s.id)}));
    tbody.append(el("tr",{},
      el("td",{},who), el("td",{class:"sid",text:s.id}), el("td",{text:s.course}),
      el("td",{text:"Year "+s.year}), el("td",{}, el("span",{class:"gpa",text:s.gpa.toFixed(2)})),
      el("td",{},actions)));
  });
  const empty = $("empty");
  if(list.length===0){
    empty.hidden = false; empty.replaceChildren();
    if(students.length===0){
      empty.append(el("strong",{text:"No students yet"}), "Select Add student to create the first record.");
    }else{
      empty.append(el("strong",{text:"No students match"}), "Clear the search or choose another course to see all records.");
    }
  }else empty.hidden = true;

  const avg = students.length ? (students.reduce((a,s)=>a+s.gpa,0)/students.length).toFixed(2) : "–";
  const courses = new Set(students.map(s=>s.course)).size;
  $("summary").replaceChildren(
    el("span",{},el("b",{text:students.length}),"students"),
    el("span",{},el("b",{text:avg}),"average GPA"),
    el("span",{},el("b",{text:courses}),"courses"));
}

/* ---------- Form (create + update) ---------- */
function clearErrors(){
  document.querySelectorAll(".err").forEach(e=>e.textContent="");
  document.querySelectorAll("#form [aria-invalid]").forEach(i=>i.removeAttribute("aria-invalid"));
}
function openForm(id=null){
  if($("viewDlg").open) $("viewDlg").close();
  editingId = id; clearErrors();
  const s = id ? students.find(x=>x.id===id) : null;
  $("formTitle").textContent = s ? "Edit student" : "Add student";
  $("saveBtn").textContent = s ? "Save changes" : "Save student";
  $("f-name").value = s ? s.name : "";
  $("f-email").value = s ? s.email : "";
  $("f-course").value = s ? s.course : COURSES[0];
  $("f-year").value = s ? s.year : 1;
  $("f-gpa").value = s ? s.gpa : "";
  $("formDlg").showModal(); $("f-name").focus();
}
$("form").addEventListener("submit", ev=>{
  ev.preventDefault();
  const data = Object.fromEntries(new FormData($("form")).entries());
  const errs = validate(data, students, editingId);
  clearErrors();
  const keys = Object.keys(errs);
  if(keys.length){
    keys.forEach(k=>{
      document.querySelector(`.err[data-for="${k}"]`).textContent = errs[k];
      $("f-"+k).setAttribute("aria-invalid","true");
    });
    $("f-"+keys[0]).focus(); return;
  }
  if(editingId){ students = updateStudent(students, editingId, data); toast("Changes saved"); }
  else { students = createStudent(students, data); toast("Student added"); }
  save(); render(); $("formDlg").close();
});
$("cancelForm").onclick = ()=>$("formDlg").close();
$("addBtn").onclick = ()=>openForm();

/* ---------- Read (detail view) ---------- */
function openView(id){
  const s = students.find(x=>x.id===id); if(!s) return;
  viewingId = id;
  const chip = $("v-chip"); chip.textContent = initials(s.name); chipStyle(chip,s.course);
  $("viewName").textContent = s.name;
  const rows = [["Student ID",s.id],["Email",s.email],["Course",s.course],["Year","Year "+s.year],["GPA",s.gpa.toFixed(2)]];
  const dl = $("v-detail"); dl.replaceChildren();
  rows.forEach(([k,v])=>dl.append(el("dt",{text:k}),el("dd",{text:v})));
  $("viewDlg").showModal();
}
$("v-close").onclick = ()=>$("viewDlg").close();
$("v-edit").onclick = ()=>openForm(viewingId);
$("v-del").onclick = ()=>{ $("viewDlg").close(); askDelete(viewingId); };

/* ---------- Delete ---------- */
function askDelete(id){
  const s = students.find(x=>x.id===id); if(!s) return;
  pendingDeleteId = id;
  $("delMsg").textContent = `${s.name} (${s.id}) will be removed permanently.`;
  $("delDlg").showModal();
}
$("delCancel").onclick = ()=>$("delDlg").close();
$("delOk").onclick = ()=>{
  students = deleteStudent(students, pendingDeleteId);
  save(); render(); $("delDlg").close(); toast("Student deleted");
};

/* ---------- Filters ---------- */
const cf = $("courseFilter");
cf.append(new Option("All courses","all")); COURSES.forEach(c=>cf.append(new Option(c,c)));
COURSES.forEach(c=>$("f-course").append(new Option(c,c)));
$("search").addEventListener("input", e=>{ view.q = e.target.value; render(); });
cf.addEventListener("change", e=>{ view.course = e.target.value; render(); });
$("sortBy").addEventListener("change", e=>{ view.sort = e.target.value; render(); });

/* close dialogs when clicking the backdrop */
document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click", e=>{ if(e.target===d) d.close(); }));

render();
</script>
</body>
</html>
